<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive Bootstrap Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container py-5">
        <header class="text-center mb-4">
            <p class="text-primary text-uppercase fw-semibold mb-1">Bootstrap Grid System</p>
            <h1 class="display-5 fw-bold">Responsive Image Gallery</h1>
            <p class="text-secondary">Gallery tự động chuyển từ 4 cột sang 2 cột và 1 cột.</p>
        </header>

        <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="gallery-card card h-100 shadow-sm">
                    <img class="card-img-top img-fluid" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Núi và hồ nước" loading="lazy">
                    <figcaption class="card-body"><h2 class="h5">Mountain Lake</h2><p class="card-text text-secondary">Nature landscape</p></figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="gallery-card card h-100 shadow-sm">
                    <img class="card-img-top img-fluid" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Ngôi nhà giữa thiên nhiên" loading="lazy">
                    <figcaption class="card-body"><h2 class="h5">Peaceful Home</h2><p class="card-text text-secondary">A quiet morning</p></figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="gallery-card card h-100 shadow-sm">
                    <img class="card-img-top img-fluid" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80" alt="Thung lũng xanh" loading="lazy">
                    <figcaption class="card-body"><h2 class="h5">Green Valley</h2><p class="card-text text-secondary">Explore the wild</p></figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="gallery-card card h-100 shadow-sm">
                    <img class="card-img-top img-fluid" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Rừng cây" loading="lazy">
                    <figcaption class="card-body"><h2 class="h5">Deep Forest</h2><p class="card-text text-secondary">Walk among trees</p></figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="gallery-card card h-100 shadow-sm">
                    <img class="card-img-top img-fluid" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Bãi biển xanh" loading="lazy">
                    <figcaption class="card-body"><h2 class="h5">Blue Beach</h2><p class="card-text text-secondary">Summer memories</p></figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="gallery-card card h-100 shadow-sm">
                    <img class="card-img-top img-fluid" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80" alt="Núi phủ tuyết" loading="lazy">
                    <figcaption class="card-body"><h2 class="h5">Snowy Peak</h2><p class="card-text text-secondary">Above the clouds</p></figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="gallery-card card h-100 shadow-sm">
                    <img class="card-img-top img-fluid" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80" alt="Hoàng hôn trên cánh đồng" loading="lazy">
                    <figcaption class="card-body"><h2 class="h5">Golden Sunset</h2><p class="card-text text-secondary">End of the day</p></figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="gallery-card card h-100 shadow-sm">
                    <img class="card-img-top img-fluid" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Dãy núi hùng vĩ" loading="lazy">
                    <figcaption class="card-body"><h2 class="h5">Wild Mountains</h2><p class="card-text text-secondary">Find your adventure</p></figcaption>
                </figure>
            </div>
        </div>
    </main>
</body>
</html>
